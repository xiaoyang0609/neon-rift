name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-smoke:
    name: Build & smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Build
        run: node build.mjs

      - name: Validate web manifest
        run: node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('manifest.webmanifest','utf8'));if(!m.icons||!m.icons.length)throw new Error('manifest 缺少图标');console.log('manifest ok:',m.name)"

      - name: Verify index.html is up to date
        run: |
          if ! git diff --quiet -- index.html; then
            echo "::error::index.html 与源码不一致，请在本地运行 node build.mjs 后一起提交"
            git diff --stat -- index.html
            exit 1
          fi

      - name: Smoke test
        run: node test/smoke.mjs
