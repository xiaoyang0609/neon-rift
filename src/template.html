<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<title>NEON RIFT · 霓虹裂隙</title>
<style>/*__CSS__*/</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="fx"></div>

<div id="topbar">
  <button id="btn-pause" class="iconbtn" title="暂停">⏸</button>
  <button id="btn-settings" class="iconbtn" title="设置">⚙</button>
</div>

<div id="settings" class="hidden">
  <div class="panel">
    <h2>设置 <span>SETTINGS</span></h2>
    <div id="settings-body"></div>
    <div class="panel-foot">
      <button id="btn-reset" class="ghost">恢复默认</button>
      <button id="btn-close" class="primary">关闭</button>
    </div>
  </div>
</div>

<div id="rotate" class="hidden">
  <div>↻</div>
  <p>横屏游玩体验更好</p>
</div>

<div id="toast" class="hidden"></div>

<script>/*__JS__*/</script>
</body>
</html>
