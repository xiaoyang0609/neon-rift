<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<title>NEON RIFT · 霓虹裂隙</title>
<meta name="theme-color" content="#03060d"/>
<link rel="manifest" href="./manifest.webmanifest"/>
<link rel="apple-touch-icon" href="./icons/icon-192.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="NEON RIFT"/>
<meta name="mobile-web-app-capable" content="yes"/>
<style>/*__CSS__*/</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="fx"></div>

<div id="topbar">
  <button id="btn-install" class="iconbtn" title="安装到桌面 / 手机">⤓</button>
  <button id="btn-upgrades" class="iconbtn" title="强化">✦</button>
  <button id="btn-pause" class="iconbtn" title="暂停">⏸</button>
  <button id="btn-settings" class="iconbtn" title="设置">⚙</button>
</div>

<div id="settings" class="hidden">
  <div class="panel">
    <h2>设置 <span>SETTINGS</span></h2>
    <div id="settings-body"></div>
    <div class="panel-foot">
      <button id="btn-reset" class="ghost">恢复默认</button>
      <button id="btn-close" class="primary">关闭</button>
    </div>
  </div>
</div>

<div id="upgrades" class="hidden">
  <div class="panel">
    <h2>强化 <span>UPGRADES</span></h2>
    <div class="shards">结晶 <b id="shard-count">0</b></div>
    <div id="upgrade-body"></div>
    <div class="panel-foot">
      <button id="btn-upgrade-close" class="primary">关闭</button>
    </div>
  </div>
</div>

<div id="install" class="hidden">
  <div class="panel">
    <h2>安装 <span>INSTALL</span></h2>
    <div id="install-body" class="guide"></div>
    <div class="panel-foot">
      <button id="btn-install-close" class="primary">知道了</button>
    </div>
  </div>
</div>

<div id="rotate" class="hidden">
  <div>↻</div>
  <p>横屏游玩体验更好</p>
</div>

<div id="toast" class="hidden"></div>

<script>/*__JS__*/</script>
<script>
(function () {
  if (!('serviceWorker' in navigator)) return;
  if (location.protocol === 'file:') return;
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  });
})();
</script>
</body>
</html>
